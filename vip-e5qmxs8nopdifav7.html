<!DOCTYPE html>
<html lang="en">
<head>
    <!-- TIKTOK PIXEL GOES HERE: paste TikTok Pixel base code snippet here -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Supporter Access | Moceol</title>
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <script src="https://kit.fontawesome.com/20cee36f21.js" crossorigin="anonymous"></script>
</head>
<body>
    <header class="navbar">
        <a href="index.html"><h2 class="logo">Moceol</h2></a>
    </header>

    <main class="page-main">
        <div class="page-header">
            <h1>SUPPORTER ACCESS</h1>
            <p>Thanks for backing the music. This page is just for you &mdash; stream-only, nothing to download.</p>
        </div>

        <div class="track-grid">

            <!--
                TO ADD MORE SUPPORTER CONTENT:
                Spotify track  -> copy a .track-card block, set the iframe src to
                                  https://open.spotify.com/embed/track/TRACK_ID
                YouTube video  -> copy a .track-card block, set the iframe src to
                                  https://www.youtube.com/embed/VIDEO_ID
                Keep this page stream-only: no direct audio/video file links, no downloads.
            -->

            <div class="track-card">
                <iframe src="https://open.spotify.com/embed/track/SUPPORTER_SPOTIFY_TRACK_ID_1" width="100%" height="152" frameborder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy" title="Supporter Spotify track"></iframe>
            </div>
            <div class="track-card">
                <iframe src="https://open.spotify.com/embed/track/SUPPORTER_SPOTIFY_TRACK_ID_2" width="100%" height="152" frameborder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy" title="Supporter Spotify track"></iframe>
            </div>
            <div class="track-card">
                <iframe src="https://www.youtube.com/embed/SUPPORTER_YOUTUBE_VIDEO_ID_1" width="100%" height="200" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" loading="lazy" title="Supporter YouTube video" allowfullscreen></iframe>
            </div>
            <div class="track-card">
                <iframe src="https://www.youtube.com/embed/SUPPORTER_YOUTUBE_VIDEO_ID_2" width="100%" height="200" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" loading="lazy" title="Supporter YouTube video" allowfullscreen></iframe>
            </div>

        </div>
    </main>

    <footer class="site-footer">
        <div class="footer-bottom">
            <p>copyright &copy;<span id="copyright-year">2022</span> Moceol Entertainment. designed by <span class="designer">@moceol</span></p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
